name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  integration:
    name: Integration (PostGIS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bangunin_aja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bangunin_aja_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: bangunin_aja_test
      JWT_ACCESS_SECRET: rahasia-ci-integrasi-yang-cukup-panjang-untuk-hs256
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet -tags integration ./internal/integration/
      - run: go test -tags integration -count=1 -v ./internal/integration/

  security:
    name: Security (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Known vulnerabilities reachable from our code
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Frontend tests
        run: npm test

  scoring:
    name: Scoring (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoring
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scoring/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
